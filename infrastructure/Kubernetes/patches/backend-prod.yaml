apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: fake-news-detection
spec:
  template:
    spec:
      containers:
      - name: backend
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        env:
        - name: WORKERS
          value: "4"
        - name: MAX_CONNECTIONS
          value: "1000"

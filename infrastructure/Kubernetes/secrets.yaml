apiVersion: v1
kind: Secret
metadata:
  name: fake-news-secrets
  namespace: fake-news-detection
type: Opaque
data:
  # Base64 encoded values
  # Use: echo -n "your-secret" | base64
  SECRET-KEY: <BASE64_ENCODED_SECRET_KEY>
  JWT-SECRET-KEY: <BASE64_ENCODED_JWT_SECRET_KEY>
  NEWS-API-KEY: <BASE64_ENCODED_NEWS_API_KEY>
  TWILIO-ACCOUNT-SID: <BASE64_ENCODED_TWILIO_SID>
  TWILIO-AUTH-TOKEN: <BASE64_ENCODED_TWILIO_TOKEN>
  TWILIO-PHONE-NUMBER: <BASE64_ENCODED_TWILIO_PHONE>
  POSTGRES-PASSWORD: <BASE64_ENCODED_POSTGRES_PASSWORD>
  MONGO-PASSWORD: <BASE64_ENCODED_MONGO_PASSWORD>

apiVersion: v1
kind: ServiceMonitor
metadata:
  name: fake-news-monitor
  namespace: fake-news-detection
  labels:
    app: fake-news-monitor
spec:
  selector:
    matchLabels:
      app: backend
  endpoints:
  - port: http
    path: /metrics
    interval: 30s

---
apiVersion: v1
kind: Service
metadata:
  name: backend-metrics
  namespace: fake-news-detection
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
  - name: http
    port: 8000
    targetPort: 8000

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: fake-news-detection
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    rule_files:
      - "fake_news_rules.yml"
    
    scrape_configs:
      - job_name: 'fake-news-backend'
        static_configs:
          - targets: ['backend:8000']
        metrics_path: /metrics
        scrape_interval: 30s
      
      - job_name: 'postgres'
        static_configs:
          - targets: ['postgres:5432']
        scrape_interval: 30s
      
      - job_name: 'redis'
        static_configs:
          - targets: ['redis:6379']
        scrape_interval: 30s
      
      - job_name: 'mongodb'
        static_configs:
          - targets: ['mongodb:27017']
        scrape_interval: 30s

  fake_news_rules.yml: |
    groups:
    - name: fake_news_alerts
      rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second"
      
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }} seconds"
      
      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pod is crash looping"
          description: "Pod {{ $labels.pod }} is crash looping"

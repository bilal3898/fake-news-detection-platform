[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fake-news-detection-platform"
version = "1.2.0"
description = "A comprehensive fake news detection platform using machine learning"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Fake News Detection Team", email = "support@fakenews-detection.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "sqlalchemy>=2.0.23",
    "psycopg2-binary>=2.9.9",
    "pymongo>=4.6.0",
    "alembic>=1.12.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "scikit-learn>=1.3.2",
    "pandas>=2.1.3",
    "numpy>=1.24.4",
    "nltk>=3.8.1",
    "spacy>=3.7.2",
    "transformers>=4.36.0",
    "torch>=2.1.1",
    "joblib>=1.3.2",
    "beautifulsoup4>=4.12.2",
    "lxml>=4.9.3",
    "newspaper3k>=0.2.8",
    "readability-lxml>=0.8.1",
    "html5lib>=1.1",
    "requests>=2.31.0",
    "aiohttp>=3.9.1",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "celery>=5.3.4",
    "redis>=5.0.1",
    "twilio>=8.10.3",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.2",
    "aiofiles>=23.2.1",
    "structlog>=23.2.0",
    "sentry-sdk>=1.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
    "pre-commit>=3.6.0",
    "isort>=5.12.0",
    "bandit>=1.7.5",
    "pydocstyle>=6.3.0",
]
docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.4.8",
]
monitoring = [
    "new-relic>=9.2.0",
]

[project.urls]
Homepage = "https://github.com/your-username/fake-news-detection-platform"
Documentation = "https://docs.fakenews-detection.com"
Repository = "https://github.com/your-username/fake-news-detection-platform"
"Bug Tracker" = "https://github.com/your-username/fake-news-detection-platform/issues"

[project.scripts]
fake-news-api = "backend.app:main"
fake-news-train = "ml_core.training_pipeline.train_production_model:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "ml_core*", "data_ingestion*"]
exclude = ["tests*", "frontend*"]

[tool.setuptools.package-data]
backend = ["models/*.pkl", "models/vectorizers/*.pkl"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["backend", "ml_core", "data_ingestion"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "newspaper.*",
    "readability.*",
    "selenium.*",
    "twilio.*",
    "celery.*",
    "redis.*",
    "pymongo.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--cov=backend",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=80",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "api: API tests",
    "ml: Machine learning tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["backend"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
skips = ["B101", "B601"]

[tool.pydocstyle]
convention = "google"
add_ignore = ["D100", "D104", "D105", "D107"]
